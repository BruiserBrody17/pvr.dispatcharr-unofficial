# Formatting/linting for the two Dispatcharr server-side plugins
# (dispatcharr-plugin/timeshift_buffer, dispatcharr-plugin/recording_edl)
# and this repo's own Python tooling (tools/check_doc_refs.py and its
# test suite) -- the only committed Python in this repo. Not the addon
# itself, which is C++ (see .clang-format for that). CI applies this
# against dispatcharr-plugin/ and tools/ explicitly, not the whole repo
# (see .github/workflows/build.yml's lint job), so a future top-level
# directory this config was never meant to opine on doesn't silently
# start failing lint.

line-length = 120
target-version = "py311"

[lint]
# Default ("E", "F") plus a few low-noise, high-value extras: unused
# imports/variables (F), bugbear's common-mistake checks (B), and simplify
# hints (SIM) -- deliberately not turning on stricter style-opinion rule
# sets (e.g. "D" docstring rules) that would fight this codebase's existing
# comment conventions rather than catch real bugs.
select = ["E", "F", "B", "SIM"]
